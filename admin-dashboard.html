<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Anime Max Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <div class="logo-text">
            <h1>Admin Dashboard</h1>
        </div>
        <button id="logoutBtn" class="logout-btn"><i class="fa-solid fa-power-off"></i> Logout</button>
    </header>

    <main class="admin-main">
        <div class="form-container">
            <h2>Add New Content</h2>
            
            <form id="contentForm">
                <div class="form-row">
                    <div class="input-group">
                        <label>Content Type</label>
                        <select id="contentType" class="admin-input">
                            <option value="anime">Anime (With Seasons & Episodes)</option>
                            <option value="movie">Movie (Single Video)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Title</label>
                        <input type="text" id="contentTitle" class="admin-input" placeholder="e.g. Solo Leveling" required>
                    </div>
                    <div class="input-group">
                        <label>Poster Image URL</label>
                        <input type="url" id="contentImage" class="admin-input" placeholder="https://..." required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Banner Image URL (Optional)</label>
                        <input type="url" id="contentBanner" class="admin-input" placeholder="https://...">
                    </div>
                    <div class="input-group">
                        <label>Rating (0-10)</label>
                        <input type="number" id="contentRating" class="admin-input" step="0.1" placeholder="8.5">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Year</label>
                        <input type="text" id="contentYear" class="admin-input" placeholder="2024">
                    </div>
                    <div class="input-group">
                        <label>Genres (Comma separated)</label>
                        <input type="text" id="contentGenres" class="admin-input" placeholder="Action, Fantasy">
                    </div>
                </div>

                <div class="input-group full-width">
                    <label>Synopsis / Description</label>
                    <textarea id="contentSynopsis" class="admin-input" rows="3" placeholder="Enter story..."></textarea>
                </div>

                <!-- DYNAMIC AREA FOR EPISODES/MOVIES -->
                <div id="dynamicFields">
                    <!-- JS will inject fields here based on Content Type -->
                </div>

                <button type="submit" class="admin-btn submit-btn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Content</button>
                <p id="uploadStatus" class="success-msg"></p>
            </form>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>

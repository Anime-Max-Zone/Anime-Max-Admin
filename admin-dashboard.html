<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <header class="admin-header">
        <div class="logo-text"><h1>Admin Dashboard</h1></div>
        <div style="display: flex; gap: 10px;">
            <a href="https://anime-max-zone.github.io/Anime-Max-Zone/index.html" target="_blank" class="logout-btn" style="border-color: #22c55e; color: #22c55e; text-decoration: none;"><i class="fa-solid fa-globe"></i> App</a>
            <button id="logoutBtn" class="logout-btn"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="admin-main">
        <h2 class="view-title">All Content</h2>
        
        <h3 class="section-title" style="color: #a855f7; margin-bottom: 15px; font-size: 16px;">Anime Series</h3>
        <div id="animeListContainer" class="admin-list">
            <p class="loading-text">Loading Anime...</p>
        </div>

        <h3 class="section-title" style="color: #a855f7; margin-top: 30px; margin-bottom: 15px; font-size: 16px;">Movies</h3>
        <div id="movieListContainer" class="admin-list">
            <p class="loading-text">Loading Movies...</p>
        </div>
    </main>

    <!-- Admin Bottom Nav -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item active"><i class="fa-solid fa-list"></i><span>Dashboard</span></a>
        <a href="admin-add-title.html" class="admin-nav-item"><i class="fa-solid fa-plus"></i><span>Add Title</span></a>
        <a href="admin-upload.html" class="admin-nav-item"><i class="fa-solid fa-upload"></i><span>Upload</span></a>
    </nav>

    <script src="admin.js"></script>
</body>
</html>

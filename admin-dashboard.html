<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">

    <!-- Custom CSS for Comments Section -->
    <style>
        .comment-card {
            background: #1e1e24;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #a855f7;
            position: relative;
            text-align: left;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
        }
        .comment-anime-title {
            color: #38bdf8;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
        }
        .comment-user {
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }
        .comment-email {
            font-size: 11px;
            color: #888;
            margin-left: 5px;
        }
        .comment-text {
            font-size: 13px;
            line-height: 1.5;
            color: #ddd;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .comment-delete-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .comment-delete-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body class="admin-body dashboard-body">

    <!-- Header Section -->
    <header class="admin-header">
        <div class="logo-text">
            <h1>Admin Dashboard</h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <!-- Quick Add Button (Mobile Friendly) -->
            <a href="admin-add-title.html" class="logout-btn" style="border-color: #a855f7; color: #a855f7; text-decoration: none; padding: 8px 12px;">
                <i class="fa-solid fa-plus"></i>
            </a>
            <!-- Visit App Button -->
            <a href="https://anime-max-zone.github.io/Anime-Max-Zone/index.html" target="_blank" class="logout-btn" style="border-color: #22c55e; color: #22c55e; text-decoration: none; padding: 8px 12px;">
                <i class="fa-solid fa-globe"></i>
            </a>
            <!-- Logout Button -->
            <button id="logoutBtn" class="logout-btn" style="padding: 8px 12px;">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="admin-main">
        <h2 class="view-title">All Content</h2>
        
        <!-- Anime Section -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #a855f7; font-size: 16px; margin: 0;">Anime Series</h3>
            <span style="font-size: 12px; color: #888;" id="animeCount">0 Items</span>
        </div>
        <div id="animeListContainer" class="admin-list">
            <p class="loading-text">Loading Anime...</p>
        </div>

        <!-- Movies Section -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 15px;">
            <h3 style="color: #a855f7; font-size: 16px; margin: 0;">Movies</h3>
            <span style="font-size: 12px; color: #888;" id="movieCount">0 Items</span>
        </div>
        <div id="movieListContainer" class="admin-list">
            <p class="loading-text">Loading Movies...</p>
        </div>

        <!-- ================= COMMENTS SECTION ================= -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px; margin-bottom: 15px;">
            <h3 style="color: #a855f7; font-size: 16px; margin: 0;"><i class="fa-solid fa-comments"></i> User Comments</h3>
            <span style="font-size: 12px; color: #888;" id="commentCount">0 Items</span>
        </div>
        <div id="commentListContainer" class="admin-list" style="margin-bottom: 50px;">
            <p class="loading-text">Loading Comments...</p>
        </div>

    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item active">
            <i class="fa-solid fa-list"></i>
            <span>Dashboard</span>
        </a>
        <a href="admin-add-title.html" class="admin-nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>Add Title</span>
        </a>
        <a href="admin-upload.html" class="admin-nav-item">
            <i class="fa-solid fa-upload"></i>
            <span>Upload</span>
        </a>
    </nav>

    <!-- Admin JS File (Data Load & Auth) -->
    <script src="admin.js"></script>

    <!-- ================= INLINE SCRIPT FOR COMMENTS ================= -->
    <script>
        // Firebase Config (Same as admin.js)
        const firebaseConfig = {
            apiKey: "AIzaSyCpfrluxsBhnz48ve9RykIy1IxzbBfk7dA",
            authDomain: "sm-studio-7.firebaseapp.com",
            databaseURL: "https://sm-studio-7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sm-studio-7",
            storageBucket: "sm-studio-7.firebasestorage.app",
            messagingSenderId: "126291501472",
            appId: "1:126291501472:web:47386660af8ec3a57204c5",
            measurementId: "G-4X9Q0761SB"
        };

        // Ensure Firebase is initialized (Prevent double initialization)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const auth = firebase.auth();

        const commentListContainer = document.getElementById('commentListContainer');
        const commentCount = document.getElementById('commentCount');

        // Check Auth before loading comments
        auth.onAuthStateChanged((user) => {
            if (user) {
                fetchAllComments();
            } else {
                commentListContainer.innerHTML = '<p class="loading-text" style="color: #ef4444;">Access Denied. Please login.</p>';
            }
        });

        function fetchAllComments() {
            // Fetch comments and content data simultaneously
            Promise.all([
                database.ref('comments').once('value'),
                database.ref('content').once('value')
            ]).then(([commentsSnapshot, contentSnapshot]) => {
                const commentsData = commentsSnapshot.val();
                const contentData = contentSnapshot.val() || {};
                
                commentListContainer.innerHTML = '';

                if (!commentsData) {
                    commentListContainer.innerHTML = '<p class="loading-text">No comments found.</p>';
                    commentCount.innerText = '0 Items';
                    return;
                }

                let allComments = [];

                // Flatten the comments object
                Object.keys(commentsData).forEach(animeId => {
                    const animeTitle = contentData[animeId] ? contentData[animeId].title : 'Unknown Anime/Movie';
                    
                    Object.keys(commentsData[animeId]).forEach(commentKey => {
                        allComments.push({
                            animeId: animeId,
                            animeTitle: animeTitle,
                            commentKey: commentKey,
                            ...commentsData[animeId][commentKey]
                        });
                    });
                });

                // Sort by newest first
                allComments.sort((a, b) => b.timestamp - a.timestamp);
                commentCount.innerText = `${allComments.length} Items`;

                if (allComments.length === 0) {
                    commentListContainer.innerHTML = '<p class="loading-text">No comments found.</p>';
                    return;
                }

                // Render Comments
                allComments.forEach(comment => {
                    const date = new Date(comment.timestamp);
                    const timeString = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    const card = document.createElement('div');
                    card.className = 'comment-card';
                    card.innerHTML = `
                        <span class="comment-anime-title"><i class="fa-solid fa-film"></i> ${comment.animeTitle}</span>
                        <div class="comment-header">
                            <div>
                                <span class="comment-user">${comment.name}</span>
                                <span class="comment-email">(${comment.email})</span>
                            </div>
                            <span>${timeString}</span>
                        </div>
                        <p class="comment-text">${comment.text}</p>
                        <button class="comment-delete-btn" onclick="deleteAdminComment('${comment.animeId}', '${comment.commentKey}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    `;
                    commentListContainer.appendChild(card);
                });

            }).catch((error) => {
                console.error("Error fetching comments:", error);
                commentListContainer.innerHTML = `<p class="loading-text" style="color:red;">Error: ${error.message}</p>`;
            });
        }

        // Delete Comment Function
        window.deleteAdminComment = (animeId, commentKey) => {
            if (confirm("Are you sure you want to delete this comment?")) {
                database.ref(`comments/${animeId}/${commentKey}`).remove()
                    .then(() => {
                        // Refresh the comments list immediately
                        fetchAllComments(); 
                    })
                    .catch((err) => alert("Error deleting comment: " + err.message));
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Anime Max Zone</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body">

    <!-- Header Section -->
    <header class="admin-header">
        <div class="logo-text">
            <h1>Admin Dashboard</h1>
        </div>
        
        <!-- Buttons Container -->
        <div style="display: flex; gap: 10px; align-items: center;">
            <!-- Website par wapas jane ka link -->
            <a href="https://anime-max-zone.github.io/Anime-Max-Zone/index.html" target="_blank" class="logout-btn" style="border-color: #22c55e; color: #22c55e; text-decoration: none; display: flex; align-items: center; gap: 5px;">
                <i class="fa-solid fa-globe"></i> Website
            </a>
            
            <!-- Logout Button -->
            <button id="logoutBtn" class="logout-btn"><i class="fa-solid fa-power-off"></i> Logout</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="admin-main">
        <div class="form-container">
            <h2>Add New Content</h2>
            
            <!-- Content Upload Form -->
            <form id="contentForm">
                
                <!-- Content Type Dropdown -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Content Type</label>
                        <select id="contentType" class="admin-input">
                            <option value="anime">Anime (With Seasons & Episodes)</option>
                            <option value="movie">Movie (Single Video)</option>
                        </select>
                    </div>
                </div>

                <!-- Title & Poster -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Title</label>
                        <input type="text" id="contentTitle" class="admin-input" placeholder="e.g. Solo Leveling" required>
                    </div>
                    <div class="input-group">
                        <label>Poster Image URL</label>
                        <input type="url" id="contentImage" class="admin-input" placeholder="https://..." required>
                    </div>
                </div>

                <!-- Banner & Rating -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Banner Image URL (Optional)</label>
                        <input type="url" id="contentBanner" class="admin-input" placeholder="https://...">
                    </div>
                    <div class="input-group">
                        <label>Rating (0-10)</label>
                        <input type="number" id="contentRating" class="admin-input" step="0.1" placeholder="8.5">
                    </div>
                </div>

                <!-- Year & Genres -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Year</label>
                        <input type="text" id="contentYear" class="admin-input" placeholder="2024">
                    </div>
                    <div class="input-group">
                        <label>Genres (Comma separated)</label>
                        <input type="text" id="contentGenres" class="admin-input" placeholder="Action, Fantasy">
                    </div>
                </div>

                <!-- Synopsis -->
                <div class="input-group full-width">
                    <label>Synopsis / Description</label>
                    <textarea id="contentSynopsis" class="admin-input" rows="3" placeholder="Enter story..."></textarea>
                </div>

                <!-- DYNAMIC AREA: JS will inject fields here based on Content Type (Anime = Episodes, Movie = Video ID) -->
                <div id="dynamicFields">
                    <!-- Fields will be rendered here -->
                </div>

                <!-- Submit Button -->
                <button type="submit" class="admin-btn submit-btn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Content
                </button>
                
                <!-- Status Message (Success/Error) -->
                <p id="uploadStatus" class="success-msg"></p>
                
            </form>
        </div>
    </main>

    <!-- Admin JS File (Form logic & Auth) -->
    <script src="admin.js"></script>
</body>
</html>

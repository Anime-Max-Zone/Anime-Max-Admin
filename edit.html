<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit — Admin</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header class="admin-header">
        <div class="logo">ADMIN PANEL</div>
        <button id="logoutBtn" class="btn-logout-top">Logout</button>
    </header>

    <main class="main-content">
        
        <h2 class="page-title">Edit Episode / Video</h2>
        
        <div class="dynamic-section selector-box">
            <div class="row-inputs">
                <div class="input-group">
                    <label>Select Anime</label>
                    <select id="editSelectAnime" required>
                        <option value="">Loading anime...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Select Episode</label>
                    <select id="editSelectEpisode" disabled>
                        <option value="">Choose Anime First</option>
                    </select>
                </div>
            </div>
        </div>

        <form id="editEpisodeForm" style="display: none;">
            <input type="hidden" id="editEpId">
            
            <div class="row-inputs">
                <div class="input-group">
                    <label>Season Number</label>
                    <input type="number" id="editEpSeason" min="1" required>
                </div>
                <div class="input-group">
                    <label>Episode Number</label>
                    <input type="number" id="editEpNumber" min="1" required>
                </div>
            </div>

            <!-- 1. VIDEO QUALITIES -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Video Qualities (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addQualityRow()">+ Add Quality</button>
                </div>
                <div id="qualityContainer"></div>
            </div>

            <!-- 2. AUDIO TRACKS -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Audio Tracks (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addAudioRow()">+ Add Audio</button>
                </div>
                <div id="audioContainer"></div>
            </div>

            <!-- 3. SUBTITLES -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Subtitles (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addSubtitleRow()">+ Add Subtitle</button>
                </div>
                <div id="subtitleContainer"></div>
            </div>

            <button type="submit" class="btn-primary">Update Episode</button>
            <p id="editEpMsg" class="success-msg"></p>
        </form>
    </main>

    <nav class="admin-bottom-nav">
        <a href="anime-list.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
            <span>List</span>
        </a>
        <a href="anime.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            <span>Add Anime</span>
        </a>
        <a href="upload.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
            <span>Upload</span>
        </a>
        <a href="edit.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
            <span>Edit</span>
        </a>
    </nav>

    <script type="module" src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Episode - Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <!-- Header Section -->
    <header class="admin-header">
        <a href="javascript:history.back()" class="logout-btn" style="border-color: #888; color: #888; text-decoration: none; padding: 8px 12px;">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
        <div class="logo-text"><h1>Edit Episode</h1></div>
        <div style="width: 70px;"></div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <form id="episodeEditForm" class="form-container">
            
            <!-- Episode Info -->
            <div class="form-row">
                <div class="input-group">
                    <label>Episode No.</label>
                    <input type="number" id="editEpNumber" class="admin-input" required>
                </div>
                <div class="input-group">
                    <label>Episode Title</label>
                    <input type="text" id="editEpTitle" class="admin-input" required>
                </div>
            </div>

            <!-- ONLY QUALITY SECTION -->
            <div style="margin-bottom: 20px; margin-top: 20px;">
                <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Video Qualities (Video Link)</label>
                <div id="epQualityContainer"></div>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <select id="epQaLabel" class="admin-input" style="width: 110px;">
                        <option value="480p">480p</option>
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                        <option value="4K">4K</option>
                    </select>
                    <input type="text" id="epQaUrl" class="admin-input" placeholder="video.m3u8 URL" style="flex: 1;">
                    <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('epQualityContainer', 'epQaLabel', 'epQaUrl')"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="admin-btn submit-btn" style="margin-top: 25px;"><i class="fa-solid fa-check"></i> Update Episode</button>
            <p id="epEditStatus" class="success-msg"></p>
        </form>
    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item">
            <i class="fa-solid fa-list"></i>
            <span>Dashboard</span>
        </a>
        <a href="admin-add-title.html" class="admin-nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>Add Title</span>
        </a>
        <a href="admin-upload.html" class="admin-nav-item">
            <i class="fa-solid fa-upload"></i>
            <span>Upload</span>
        </a>
        <a href="admin-comments.html" class="admin-nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>Comments</span>
        </a>
    </nav>

    <!-- Admin JS File -->
    <script src="admin.js"></script>
</body>
</html>

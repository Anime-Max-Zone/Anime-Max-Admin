<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Movie - Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <!-- Header Section -->
    <header class="admin-header">
        <a href="admin-dashboard.html" class="logout-btn" style="border-color: #888; color: #888; text-decoration: none; padding: 8px 12px;">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
        <div class="logo-text"><h1>Edit Movie</h1></div>
        <div style="width: 70px;"></div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <form id="movieEditForm" class="form-container">
            <!-- Hidden ID -->
            <input type="hidden" id="editMovieId">
            
            <!-- Basic Info -->
            <h3 style="color: #a855f7; font-size: 16px; margin-bottom: 15px;">Basic Information</h3>
            <div class="form-row">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="editMovieTitle" class="admin-input" required>
                </div>
                <div class="input-group">
                    <label>Content Type</label>
                    <input type="text" id="editMovieType" class="admin-input" readonly style="background: #13131a; color: #888;">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Poster Image URL</label>
                    <input type="url" id="editMovieImage" class="admin-input" required>
                </div>
                <div class="input-group">
                    <label>Banner Image URL</label>
                    <input type="url" id="editMovieBanner" class="admin-input">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Rating (0-10)</label>
                    <input type="number" id="editMovieRating" class="admin-input" step="0.1">
                </div>
                <div class="input-group">
                    <label>Year</label>
                    <input type="text" id="editMovieYear" class="admin-input">
                </div>
            </div>

            <div class="input-group full-width">
                <label>Genres (Comma separated)</label>
                <input type="text" id="editMovieGenres" class="admin-input" placeholder="Action, Thriller">
            </div>

            <div class="input-group full-width">
                <label>Synopsis</label>
                <textarea id="editMovieSynopsis" class="admin-input" rows="3"></textarea>
            </div>

            <!-- Links Section -->
            <div style="margin-top: 30px; border-top: 1px solid #1a1a24; padding-top: 20px;">
                <h3 style="color: #a855f7; font-size: 16px; margin-bottom: 15px;">Movie Links</h3>
                
                <!-- ONLY QUALITY SECTION -->
                <div>
                    <label style="color:#aaa; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Video Qualities (Video Link)</label>
                    <div id="movieQaContainer"></div>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <select id="movieQaLabel" class="admin-input" style="width: 110px;">
                            <option value="480p">480p</option>
                            <option value="720p">720p</option>
                            <option value="1080p">1080p</option>
                            <option value="4K">4K</option>
                        </select>
                        <input type="text" id="movieQaUrl" class="admin-input" placeholder="video.m3u8 URL" style="flex: 1;">
                        <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('movieQaContainer', 'movieQaLabel', 'movieQaUrl')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="admin-btn submit-btn" style="margin-top: 25px;"><i class="fa-solid fa-check"></i> Update Movie</button>
            <p id="movieEditStatus" class="success-msg"></p>
        </form>

        <!-- Delete Section -->
        <div style="margin-top: 30px; padding: 20px; border: 1px dashed #ff4d4d; border-radius: 10px; text-align: center;">
            <p style="color: #ff4d4d; font-size: 13px; margin-bottom: 15px;">Delete this Movie permanently?</p>
            <button id="deleteMovieBtn" class="logout-btn" style="width: 100%; justify-content: center; padding: 12px;"><i class="fa-solid fa-trash"></i> Delete Movie</button>
        </div>
    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item">
            <i class="fa-solid fa-list"></i>
            <span>Dashboard</span>
        </a>
        <a href="admin-add-title.html" class="admin-nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>Add Title</span>
        </a>
        <a href="admin-upload.html" class="admin-nav-item">
            <i class="fa-solid fa-upload"></i>
            <span>Upload</span>
        </a>
        <a href="admin-comments.html" class="admin-nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>Comments</span>
        </a>
    </nav>

    <!-- Admin JS File -->
    <script src="admin.js"></script>
</body>
</html>

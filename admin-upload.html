<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload - Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <header class="admin-header">
        <a href="admin-dashboard.html" class="logout-btn" style="border-color: #888; color: #888; text-decoration: none; padding: 8px 12px;">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
        <div class="logo-text"><h1>Upload Content</h1></div>
        <div style="width: 70px;"></div>
    </header>

    <main class="admin-main">
        <form id="uploadForm" class="form-container">
            
            <div class="input-group full-width" style="margin-bottom: 20px;">
                <label>Select Anime or Movie</label>
                <select id="uploadTitleSelect" class="admin-input" required>
                    <option value="">-- Loading Content... --</option>
                </select>
            </div>

            <!-- ================= MOVIE UPLOAD FIELDS ================= -->
            <div id="uploadMovieFields" style="display: none;">
                <div class="season-box" style="border-color: #a855f7; border-style: solid;">
                    <h4>Movie Details</h4>

                    <!-- 1. QUALITY SECTION -->
                    <div style="margin-bottom: 20px;">
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Video Qualities</label>
                        <div id="movieQualityContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="movieQaLabel" class="admin-input" style="width: 110px;">
                                <option value="480p">480p</option>
                                <option value="720p">720p</option>
                                <option value="1080p">1080p</option>
                                <option value="4K">4K</option>
                            </select>
                            <input type="text" id="movieQaUrl" class="admin-input" placeholder="URL / GDrive ID" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('movieQualityContainer', 'movieQaLabel', 'movieQaUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <!-- 2. AUDIO SECTION -->
                    <div style="margin-bottom: 20px;">
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Audio Tracks</label>
                        <div id="movieAudioContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="movieAuLabel" class="admin-input" style="width: 110px;">
                                <option value="Hindi">Hindi</option>
                                <option value="English">English</option>
                                <option value="Tamil">Tamil</option>
                                <option value="Telugu">Telugu</option>
                                <option value="Japanese">Japanese</option>
                            </select>
                            <input type="text" id="movieAuUrl" class="admin-input" placeholder="URL / GDrive ID" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('movieAudioContainer', 'movieAuLabel', 'movieAuUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <!-- 3. SUBTITLE SECTION -->
                    <div>
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Subtitles (.vtt)</label>
                        <div id="movieSubtitleContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="movieSubLabel" class="admin-input" style="width: 110px;">
                                <option value="English">English</option>
                                <option value="Hindi">Hindi</option>
                                <option value="None">None</option>
                            </select>
                            <input type="text" id="movieSubUrl" class="admin-input" placeholder=".vtt URL" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('movieSubtitleContainer', 'movieSubLabel', 'movieSubUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ================= ANIME UPLOAD FIELDS ================= -->
            <div id="uploadAnimeFields" style="display: none;">
                <div class="form-row">
                    <div class="input-group">
                        <label>Season Name</label>
                        <input type="text" id="uploadSeasonName" class="admin-input" value="Season 1">
                    </div>
                    <div class="input-group">
                        <label>Episode No.</label>
                        <input type="number" id="newEpNumber" class="admin-input" placeholder="e.g. 1">
                    </div>
                </div>
                <div class="input-group full-width" style="margin-bottom: 15px;">
                    <label>Episode Title</label>
                    <input type="text" id="newEpTitle" class="admin-input" placeholder="Episode Title">
                </div>

                <div class="season-box">
                    <h4>Episode Links</h4>
                    
                    <!-- 1. QUALITY SECTION -->
                    <div style="margin-bottom: 20px;">
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Video Qualities</label>
                        <div id="animeQualityContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="animeQaLabel" class="admin-input" style="width: 110px;">
                                <option value="480p">480p</option>
                                <option value="720p">720p</option>
                                <option value="1080p">1080p</option>
                                <option value="4K">4K</option>
                            </select>
                            <input type="text" id="animeQaUrl" class="admin-input" placeholder="URL / GDrive ID" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('animeQualityContainer', 'animeQaLabel', 'animeQaUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <!-- 2. AUDIO SECTION -->
                    <div style="margin-bottom: 20px;">
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Audio Tracks</label>
                        <div id="animeAudioContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="animeAuLabel" class="admin-input" style="width: 110px;">
                                <option value="Hindi">Hindi</option>
                                <option value="English">English</option>
                                <option value="Tamil">Tamil</option>
                                <option value="Telugu">Telugu</option>
                                <option value="Japanese">Japanese</option>
                            </select>
                            <input type="text" id="animeAuUrl" class="admin-input" placeholder="URL / GDrive ID" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('animeAudioContainer', 'animeAuLabel', 'animeAuUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <!-- 3. SUBTITLE SECTION -->
                    <div>
                        <label style="color:#a855f7; font-size:13px; font-weight:600; margin-bottom: 5px; display:block;">Subtitles (.vtt)</label>
                        <div id="animeSubtitleContainer"></div>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <select id="animeSubLabel" class="admin-input" style="width: 110px;">
                                <option value="English">English</option>
                                <option value="Hindi">Hindi</option>
                                <option value="None">None</option>
                            </select>
                            <input type="text" id="animeSubUrl" class="admin-input" placeholder=".vtt URL" style="flex: 1;">
                            <button type="button" class="add-ep-btn" style="width: auto; padding: 0 15px; margin-top:0;" onclick="addLink('animeSubtitleContainer', 'animeSubLabel', 'animeSubUrl')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                </div>
            </div>

            <button type="submit" class="admin-btn submit-btn" id="uploadSubmitBtn" style="display: none;">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Content
            </button>
            <p id="uploadStatus" class="success-msg"></p>
        </form>
    </main>

    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item"><i class="fa-solid fa-list"></i><span>Dashboard</span></a>
        <a href="admin-add-title.html" class="admin-nav-item"><i class="fa-solid fa-plus"></i><span>Add Title</span></a>
        <a href="admin-upload.html" class="admin-nav-item active"><i class="fa-solid fa-upload"></i><span>Upload</span></a>
    </nav>

    <script src="admin.js"></script>
</body>
</html>

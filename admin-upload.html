<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload - Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <!-- Header Section -->
    <header class="admin-header">
        <a href="admin-dashboard.html" class="logout-btn" style="border-color: #888; color: #888; text-decoration: none; padding: 8px 12px;">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
        <div class="logo-text"><h1>Upload Content</h1></div>
        <div style="width: 70px;"></div> <!-- Flexbox balance ke liye -->
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <form id="uploadForm" class="form-container">
            
            <!-- Select Title -->
            <div class="input-group full-width" style="margin-bottom: 20px;">
                <label>Select Anime or Movie</label>
                <select id="uploadTitleSelect" class="admin-input" required>
                    <option value="">-- Loading Content... --</option>
                </select>
            </div>

            <!-- ================= MOVIE UPLOAD FIELDS ================= -->
            <div id="uploadMovieFields" style="display: none;">
                <div class="season-box" style="border-style: solid; border-color: #a855f7;">
                    <h4>Movie Details</h4>
                    
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label>Audio Language (e.g. Hindi, English)</label>
                        <input type="text" id="movieAudio" class="admin-input" value="Hindi">
                    </div>

                    <label style="color:#aaa; font-size:12px; margin-bottom: 5px; display:block;">Video Qualities (Leave blank if not available)</label>
                    <input type="text" id="movieVideo480" class="admin-input" placeholder="480p Link / GDrive ID" style="margin-bottom: 10px;">
                    <input type="text" id="movieVideo720" class="admin-input" placeholder="720p Link / GDrive ID" style="margin-bottom: 10px;">
                    <input type="text" id="movieVideo1080" class="admin-input" placeholder="1080p Link / GDrive ID" style="margin-bottom: 10px;">
                    
                    <label style="color:#aaa; font-size:12px; margin-bottom: 5px; display:block;">Subtitle (.vtt format)</label>
                    <input type="url" id="movieSubtitle" class="admin-input" placeholder="https://example.com/sub.vtt">
                </div>
            </div>

            <!-- ================= ANIME UPLOAD FIELDS ================= -->
            <div id="uploadAnimeFields" style="display: none;">
                <div class="form-row">
                    <div class="input-group">
                        <label>Season Name</label>
                        <input type="text" id="uploadSeasonName" class="admin-input" value="Season 1">
                    </div>
                    <div class="input-group">
                        <label>Audio Language (e.g. Hindi, English)</label>
                        <input type="text" id="animeAudio" class="admin-input" value="Hindi">
                    </div>
                </div>

                <div class="season-box">
                    <h4>Add New Episode</h4>
                    <div class="ep-row" style="flex-direction: column; gap: 10px;">
                        
                        <div style="display: flex; gap: 10px; width: 100%;">
                            <input type="number" id="newEpNumber" class="admin-input" placeholder="Ep No." style="width: 80px;">
                            <input type="text" id="newEpTitle" class="admin-input" placeholder="Episode Title" style="flex: 1;">
                        </div>

                        <label style="color:#aaa; font-size:12px; margin-top: 5px; display:block;">Video Qualities (Links/IDs)</label>
                        <input type="text" id="newEpVideo480" class="admin-input" placeholder="480p Link / GDrive ID">
                        <input type="text" id="newEpVideo720" class="admin-input" placeholder="720p Link / GDrive ID">
                        <input type="text" id="newEpVideo1080" class="admin-input" placeholder="1080p Link / GDrive ID">

                        <label style="color:#aaa; font-size:12px; margin-top: 5px; display:block;">Subtitle (.vtt format)</label>
                        <input type="url" id="animeSubtitle" class="admin-input" placeholder="https://example.com/sub.vtt">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="admin-btn submit-btn" id="uploadSubmitBtn" style="display: none;">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Content
            </button>
            
            <!-- Status Message -->
            <p id="uploadStatus" class="success-msg"></p>
        </form>
    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item">
            <i class="fa-solid fa-list"></i>
            <span>Dashboard</span>
        </a>
        <a href="admin-add-title.html" class="admin-nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>Add Title</span>
        </a>
        <a href="admin-upload.html" class="admin-nav-item active">
            <i class="fa-solid fa-upload"></i>
            <span>Upload</span>
        </a>
    </nav>

    <!-- Admin JS File -->
    <script src="admin.js"></script>
</body>
</html>

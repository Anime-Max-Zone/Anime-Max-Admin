<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Episode — Admin</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header class="admin-header">
        <div class="logo">ADMIN PANEL</div>
        <button id="logoutBtn" class="btn-logout-top">Logout</button>
    </header>

    <main class="main-content">
        
        <h2 class="page-title">Upload Movie / Episode</h2>
        
        <form id="episodeForm">
            
            <div class="input-group">
                <label>Select Anime</label>
                <select id="selectAnimeForEp" required>
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="row-inputs">
                <div class="input-group">
                    <label>Season Number</label>
                    <input type="number" id="epSeason" value="1" min="1" required>
                </div>
                <div class="input-group">
                    <label>Episode Number</label>
                    <input type="number" id="epNumber" value="1" min="1" required>
                </div>
            </div>

            <!-- 1. VIDEO QUALITIES -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Video Qualities (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addQualityRow()">+ Add Quality</button>
                </div>
                <div id="qualityContainer">
                    <div class="dynamic-row">
                        <input type="url" placeholder="Video URL (MP4 or GDrive)" class="v-url">
                        <select class="v-quality">
                            <option value="1080">1080p HD</option>
                            <option value="720">720p</option>
                            <option value="480">480p</option>
                        </select>
                        <button type="button" class="btn-remove-row" onclick="removeRow(this)">×</button>
                    </div>
                </div>
            </div>

            <!-- 2. AUDIO TRACKS -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Audio Tracks (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addAudioRow()">+ Add Audio</button>
                </div>
                <div id="audioContainer">
                    <div class="dynamic-row">
                        <input type="url" placeholder="Audio/Video URL (MP4)" class="a-url">
                        <select class="a-lang">
                            <option value="Japanese">Japanese Audio</option>
                            <option value="English">English Dub</option>
                            <option value="Hindi">Hindi Dub</option>
                        </select>
                        <button type="button" class="btn-remove-row" onclick="removeRow(this)">×</button>
                    </div>
                </div>
            </div>

            <!-- 3. SUBTITLES -->
            <div class="dynamic-section">
                <div class="dynamic-header">
                    <h3>Subtitles (Optional)</h3>
                    <button type="button" class="btn-add-row" onclick="addSubtitleRow()">+ Add Subtitle</button>
                </div>
                <div id="subtitleContainer">
                    <div class="dynamic-row">
                        <input type="url" placeholder="Subtitle URL (.vtt)" class="s-url">
                        <select class="s-lang">
                            <option value="en">English</option>
                            <option value="hi">Hindi</option>
                            <option value="ur">Urdu</option>
                        </select>
                        <button type="button" class="btn-remove-row" onclick="removeRow(this)">×</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Upload Episode</button>
            <p id="episodeMsg" class="success-msg"></p>
            
        </form>
    </main>

    <nav class="admin-bottom-nav">
        <a href="anime-list.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
            <span>List</span>
        </a>
        <a href="anime.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            <span>Add Anime</span>
        </a>
        <a href="upload.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
            <span>Upload</span>
        </a>
        <a href="edit.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
            <span>Edit</span>
        </a>
    </nav>

    <script type="module" src="admin.js"></script>
</body>
</html>

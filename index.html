<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Anime Max Zone</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- External CSS Link for Admin -->
    <link rel="stylesheet" href="admin.css" />
</head>
<body>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p>Enter your credentials to manage anime.</p>
            
            <input type="email" id="adminEmail" placeholder="Email Address" />
            <input type="password" id="adminPassword" placeholder="Password" />
            
            <button id="loginBtn" class="btn-primary">Login</button>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div id="dashboard" class="dashboard-container" style="display: none;">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">ADMIN PANEL</div>
            <nav>
                <button class="nav-btn active" onclick="showTab('addAnimeTab')">Add Anime</button>
                <button class="nav-btn" onclick="showTab('addEpisodeTab')">Add Episode</button>
                <button class="nav-btn" onclick="showTab('manageAnimeTab')">Manage Anime</button>
            </nav>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Add Anime Tab -->
            <section id="addAnimeTab" class="tab-content active">
                <h2>Add New Anime</h2>
                <form id="animeForm">
                    <div class="input-group">
                        <label>Anime Title</label>
                        <input type="text" id="animeTitle" required placeholder="e.g. Naruto" />
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="animeDesc" rows="3" required placeholder="Anime description..."></textarea>
                    </div>
                    <div class="input-group">
                        <label>Cover Image URL (Poster)</label>
                        <input type="url" id="animePoster" required placeholder="https://..." />
                    </div>
                    <div class="input-group">
                        <label>Genres (Comma separated)</label>
                        <input type="text" id="animeGenres" required placeholder="Action, Adventure" />
                    </div>
                    <div class="input-group">
                        <label>Type</label>
                        <select id="animeType">
                            <option value="series">Series</option>
                            <option value="movie">Movie</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Total Seasons (If Series)</label>
                        <input type="number" id="animeSeasons" value="1" min="1" />
                    </div>
                    <button type="submit" class="btn-primary">Add Anime to Database</button>
                    <p id="animeMsg" class="success-msg"></p>
                </form>
            </section>

            <!-- Add Episode Tab -->
            <section id="addEpisodeTab" class="tab-content">
                <h2>Add Episode / Video</h2>
                <form id="episodeForm">
                    <div class="input-group">
                        <label>Select Anime</label>
                        <select id="selectAnimeForEp" required>
                            <option value="">Loading anime...</option>
                        </select>
                    </div>
                    <div class="row-inputs">
                        <div class="input-group">
                            <label>Season No.</label>
                            <input type="number" id="epSeason" value="1" min="1" required />
                        </div>
                        <div class="input-group">
                            <label>Episode No.</label>
                            <input type="number" id="epNumber" value="1" min="1" required />
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Video URL (MP4 or GDrive Link)</label>
                        <input type="url" id="epVideoUrl" required placeholder="https://drive.google.com/... OR https://...mp4" />
                    </div>
                    <div class="input-group">
                        <label>Subtitle URL (VTT file - Optional)</label>
                        <input type="url" id="epSubUrl" placeholder="https://...vtt" />
                    </div>
                    <button type="submit" class="btn-primary">Add Episode</button>
                    <p id="episodeMsg" class="success-msg"></p>
                </form>
            </section>

            <!-- Manage Anime Tab -->
            <section id="manageAnimeTab" class="tab-content">
                <h2>Manage Anime & Episodes</h2>
                <div id="adminAnimeList" class="admin-list">
                    <!-- JS will populate anime list here -->
                </div>
            </section>

        </main>
    </div>

    <!-- Firebase & Admin Scripts -->
    <script type="module" src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - Anime Max Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body">

    <div class="login-container">
        <div class="logo-area" style="justify-content: center; margin-bottom: 25px; flex-direction: column; text-align: center;">
            <div class="logo-icon" style="margin-bottom: 10px;"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">
                <h1>ANIME <span class="purple-text">MAX</span> ZONE</h1>
                <p>Admin Panel</p>
            </div>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Login to manage your content</p>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="adminEmail" placeholder="Email Address">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="adminPassword" placeholder="Password">
        </div>

        <button id="loginBtn" class="admin-btn">Login</button>
        
        <div class="divider">
            <span>OR</span>
        </div>

        <button id="googleLoginBtn" class="admin-btn google-btn">
            <i class="fa-brands fa-google" style="color: #DB4437; font-size: 18px;"></i>
            Continue with Google
        </button>

        <p id="loginError" class="error-msg"></p>
    </div>

    <script src="admin.js"></script>
</body>
</html>

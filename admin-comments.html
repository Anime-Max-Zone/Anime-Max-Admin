<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Comments - Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Same version as admin.js) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- Admin CSS File -->
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body dashboard-body">

    <!-- Header Section -->
    <header class="admin-header">
        <div class="logo-text">
            <h1>Manage Comments</h1>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <!-- Back to Dashboard Button -->
            <a href="admin-dashboard.html" class="logout-btn" style="border-color: #38bdf8; color: #38bdf8; text-decoration: none;" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <!-- Logout Button -->
            <button id="logoutBtn" class="logout-btn" title="Logout">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="admin-main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #a855f7; font-size: 16px; margin: 0;"><i class="fa-solid fa-comments"></i> All User Comments</h3>
            <span style="font-size: 12px; color: #888;" id="commentCount">0 Items</span>
        </div>
        
        <!-- Comments List Container -->
        <div id="commentListContainer" class="admin-list" style="margin-bottom: 50px;">
            <p class="loading-text">Loading Comments...</p>
        </div>
    </main>

    <!-- Admin Bottom Navigation -->
    <nav class="admin-bottom-nav">
        <a href="admin-dashboard.html" class="admin-nav-item">
            <i class="fa-solid fa-list"></i>
            <span>Dashboard</span>
        </a>
        <a href="admin-add-title.html" class="admin-nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>Add Title</span>
        </a>
        <a href="admin-upload.html" class="admin-nav-item">
            <i class="fa-solid fa-upload"></i>
            <span>Upload</span>
        </a>
        <a href="admin-comments.html" class="admin-nav-item active">
            <i class="fa-solid fa-comments"></i>
            <span>Comments</span>
        </a>
    </nav>

    <!-- Admin JS File (Handles Auth, Data Fetch, and Delete Logic) -->
    <script src="admin.js"></script>
</body>
</html>

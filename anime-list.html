<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080611">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Anime List — Anime Max Zone Admin</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Admin Stylesheet -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- ================= TOP HEADER ================= -->

    <header class="admin-header">

        <a
            href="anime-list.html"
            class="logo"
            aria-label="Admin Panel Home"
        >
            ADMIN PANEL
        </a>

        <button
            type="button"
            id="logoutBtn"
            class="btn-logout-top"
        >
            Logout
        </button>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <!-- Page Heading -->

        <section class="page-title-row">

            <div>
                <h1>All Anime / Movies</h1>

                <p>
                    Manage your anime catalogue and episodes.
                </p>
            </div>

            <a
                href="anime.html"
                class="btn-primary btn-small"
            >
                + Add New
            </a>

        </section>


        <!-- Anime List -->

        <section
            class="admin-list-section"
            aria-label="Anime catalogue"
        >

            <div
                id="adminAnimeList"
                class="admin-list"
                aria-live="polite"
                aria-busy="true"
            >

                <p
                    style="
                        color: var(--text-muted, #9ca3af);
                        text-align: center;
                        padding: 24px;
                    "
                >
                    Loading anime list...
                </p>

            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAVIGATION ================= -->

    <nav
        class="admin-bottom-nav"
        aria-label="Admin navigation"
    >

        <!-- Anime List -->

        <a
            href="anime-list.html"
            class="nav-item active"
            aria-current="page"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 6h16M4 10h16M4 14h16M4 18h16"
                />
            </svg>

            <span>List</span>

        </a>


        <!-- Add Anime -->

        <a
            href="anime.html"
            class="nav-item"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 4v16m8-8H4"
                />
            </svg>

            <span>Add Anime</span>

        </a>


        <!-- Upload Episode -->

        <a
            href="upload.html"
            class="nav-item"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                />
            </svg>

            <span>Upload</span>

        </a>


        <!-- Edit Episode -->

        <a
            href="edit.html"
            class="nav-item"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                />
            </svg>

            <span>Edit</span>

        </a>

    </nav>


    <!-- ================= FIREBASE ADMIN SCRIPT ================= -->

    <script type="module" src="admin.js"></script>

</body>
</html>
